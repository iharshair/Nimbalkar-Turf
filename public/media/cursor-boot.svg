<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Football boot">
  <!--
    Cursor artwork: red football boot (stud), flat sticker style.

    Hand-authored to match the supplied reference. The toe tip sits at
    roughly (14.5, 31.5) in this 100x100 box — CustomCursor.tsx uses those
    fractions as the pointer hotspot, so if you replace this file with
    different art, keep the toe near that spot or update TOE_X / TOE_Y.

    Layer order matters: studs first so the boot's white sticker outline
    overlaps where they meet the sole, then the body, then details clipped
    to the silhouette so nothing can spill past the outline.
  -->
  <defs>
    <clipPath id="nsc-boot-clip">
      <path d="M14.5 31.5C18 26.5 26 24.5 34.5 25.8C42 27 49 30.2 54.8 34.6L60.5 32.4C66 36 72 42.5 77 49.5C82 56.5 86.5 63.5 84.5 69.5C82.5 75.5 75 78.5 68.5 75.5C57 70 43 58.5 30.5 47C22.5 39.8 16.5 35.5 14.5 31.5Z"/>
    </clipPath>
  </defs>

  <!-- Studs, each with its own sticker border. -->
  <g>
    <g stroke="#FFFFFF" stroke-width="4.2" stroke-linejoin="round">
      <rect x="16.1" y="37.0" width="8" height="6.4" rx="1.8" fill="#3B3B3F" transform="rotate(39.2 20.1 40.2)"/>
      <rect x="26.3" y="45.3" width="8" height="6.4" rx="1.8" fill="#3B3B3F" transform="rotate(39.2 30.3 48.5)"/>
      <rect x="36.6" y="53.7" width="8" height="6.4" rx="1.8" fill="#3B3B3F" transform="rotate(39.2 40.6 56.9)"/>
      <rect x="47.4" y="62.5" width="8" height="6.4" rx="1.8" fill="#3B3B3F" transform="rotate(39.2 51.4 65.7)"/>
      <rect x="57.1" y="70.4" width="8" height="6.4" rx="1.8" fill="#3B3B3F" transform="rotate(39.2 61.1 73.6)"/>
    </g>
    <g fill="#3B3B3F">
      <rect x="16.1" y="37.0" width="8" height="6.4" rx="1.8" transform="rotate(39.2 20.1 40.2)"/>
      <rect x="26.3" y="45.3" width="8" height="6.4" rx="1.8" transform="rotate(39.2 30.3 48.5)"/>
      <rect x="36.6" y="53.7" width="8" height="6.4" rx="1.8" transform="rotate(39.2 40.6 56.9)"/>
      <rect x="47.4" y="62.5" width="8" height="6.4" rx="1.8" transform="rotate(39.2 51.4 65.7)"/>
      <rect x="57.1" y="70.4" width="8" height="6.4" rx="1.8" transform="rotate(39.2 61.1 73.6)"/>
    </g>
  </g>

  <!-- White sticker outline. -->
  <path
    d="M14.5 31.5C18 26.5 26 24.5 34.5 25.8C42 27 49 30.2 54.8 34.6L60.5 32.4C66 36 72 42.5 77 49.5C82 56.5 86.5 63.5 84.5 69.5C82.5 75.5 75 78.5 68.5 75.5C57 70 43 58.5 30.5 47C22.5 39.8 16.5 35.5 14.5 31.5Z"
    fill="none" stroke="#FFFFFF" stroke-width="5.6" stroke-linejoin="round"/>

  <!-- Body. -->
  <path
    d="M14.5 31.5C18 26.5 26 24.5 34.5 25.8C42 27 49 30.2 54.8 34.6L60.5 32.4C66 36 72 42.5 77 49.5C82 56.5 86.5 63.5 84.5 69.5C82.5 75.5 75 78.5 68.5 75.5C57 70 43 58.5 30.5 47C22.5 39.8 16.5 35.5 14.5 31.5Z"
    fill="#E1252B"/>

  <!-- Details, clipped so they can never bleed past the outline. -->
  <g clip-path="url(#nsc-boot-clip)">
    <!-- Heel, in shadow. -->
    <path d="M52 60C60 65.5 67 71 72 75.5C77 79.5 84 77 86 70C87.5 64.5 84 57 79.5 50.5L70 62Z" fill="#A5121D"/>

    <!-- Midfoot stripe. -->
    <path d="M20 37.6C32 45 40.5 52.5 50 59C59 65.5 65 70.5 69.5 74.5"
          fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

    <!-- Lace panel. -->
    <path d="M38.2 27C45.5 27.9 53.2 31.4 59.2 36L62.6 32.2C56 27.2 47.6 23.8 39.4 23.2Z" fill="#A5121D"/>
    <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round">
      <path d="M41.3 32.2L43.9 25.8"/>
      <path d="M45.7 34L48.3 27.6"/>
      <path d="M50.1 35.8L52.7 29.4"/>
      <path d="M54.5 37.5L57.1 31.1"/>
    </g>
  </g>
</svg>
